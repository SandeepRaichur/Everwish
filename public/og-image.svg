<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Midnight Luxury Canvas -->
  <rect width="1200" height="630" fill="#10131D"/>
  
  <!-- Subtle Champagne & Rose Ambient Glows -->
  <circle cx="600" cy="220" r="320" fill="#D9BD88" fill-opacity="0.08" filter="blur(80px)"/>
  <circle cx="950" cy="420" r="280" fill="#D88F9A" fill-opacity="0.06" filter="blur(80px)"/>

  <!-- Ornate Luxury Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="#D9BD88" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="52" y="52" width="1096" height="526" rx="16" stroke="#D9BD88" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Brand Wordmark & Seal -->
  <g transform="translate(100, 110)">
    <!-- Seal Icon -->
    <rect width="48" height="48" rx="14" fill="#1D2233" stroke="#D9BD88" stroke-width="2"/>
    <text x="24" y="32" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#D9BD88" text-anchor="middle">E</text>
    
    <!-- Brand Title -->
    <text x="64" y="28" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFF5E7" letter-spacing="-0.5">EVERWISH</text>
    <text x="64" y="45" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#D9BD88" letter-spacing="4">KEEPSAKE STUDIOS</text>
  </g>

  <!-- Main Value Proposition Headline -->
  <text x="100" y="270" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#FFF5E7" line-height="1.2">
    More than a birthday wish.
  </text>
  <text x="100" y="335" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#D9BD88" line-height="1.2">
    A moment they'll never forget.
  </text>

  <!-- Supporting Narrative -->
  <text x="100" y="415" font-family="'Segoe UI', sans-serif" font-size="22" fill="#FFF5E7" fill-opacity="0.8" font-weight="300">
    Bespoke, cinematic birthday websites crafted from your personal photos,
  </text>
  <text x="100" y="450" font-family="'Segoe UI', sans-serif" font-size="22" fill="#FFF5E7" fill-opacity="0.8" font-weight="300">
    cherished memories, and favorite songs for partners, best friends, and family.
  </text>

  <!-- Trust & SLA Badges -->
  <g transform="translate(100, 505)">
    <!-- Badge 1 -->
    <rect width="210" height="38" rx="19" fill="#1D2233" stroke="#D9BD88" stroke-opacity="0.4"/>
    <text x="105" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#D9BD88" text-anchor="middle">✨ 100% Human-Coded</text>

    <!-- Badge 2 -->
    <rect x="225" width="230" height="38" rx="19" fill="#1D2233" stroke="#D9BD88" stroke-opacity="0.4"/>
    <text x="340" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFF5E7" fill-opacity="0.9" text-anchor="middle">⏱ 24–48 Hour Turnaround</text>

    <!-- Badge 3 -->
    <rect x="470" width="200" height="38" rx="19" fill="#1D2233" stroke="#D88F9A" stroke-opacity="0.4"/>
    <text x="570" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#D88F9A" text-anchor="middle">🔒 Private &amp; Ad-Free</text>
  </g>

  <!-- Pricing Tag Pill on Right -->
  <g transform="translate(850, 485)">
    <rect width="250" height="60" rx="16" fill="#151926" stroke="#D9BD88" stroke-width="1.5"/>
    <text x="125" y="26" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#D9BD88" text-anchor="middle" letter-spacing="2">COMMISSIONS FROM</text>
    <text x="125" y="50" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#FFF5E7" text-anchor="middle">₹499 – ₹1,499</text>
  </g>
</svg>
